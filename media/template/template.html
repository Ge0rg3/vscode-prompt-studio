<!DOCTYPE html>
<!-- The template editor, an empty editor pane above its attachment chips and toolbar buttons -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="{{csp}}" />
  <link rel="stylesheet" href="{{codiconCss}}" />
  <link rel="stylesheet" href="{{toolbarCss}}" />
  <link rel="stylesheet" href="{{templateCss}}" />
  <title>Template</title>
</head>
<body data-nonce="{{nonce}}">
  <div id="editor"></div>
  <div id="attachments"></div>
  <div id="toolbar">
    <button id="toggle" class="bar-button" type="button">
      <span id="toggle-icon" class="codicon codicon-eye"></span>
      <span id="toggle-label">Rendered</span>
    </button>
    <span class="toolbar-spacer"></span>
    <button id="attach" class="bar-button" type="button">
      <span class="codicon codicon-attach"></span>
      <span>Attach</span>
    </button>
    <button id="save" class="bar-button" type="button">
      <span class="codicon codicon-save"></span>
      <span>Save</span>
    </button>
    <button id="copy" class="bar-button" type="button">
      <span class="codicon codicon-copy"></span>
      <span>Copy</span>
    </button>
    <button id="send" class="bar-button primary" type="button">
      <span class="codicon codicon-claude"></span>
      <span>Send to Claude</span>
    </button>
  </div>
  <script nonce="{{nonce}}" src="{{templateJs}}"></script>
</body>
</html>
